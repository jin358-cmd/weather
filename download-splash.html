<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>下載 Splash 圖示</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Noto Sans TC", sans-serif;
        background: #f4efe6;
        color: #122033;
      }
      main {
        width: min(92vw, 460px);
        padding: 28px 24px;
        border: 1px solid #d4c4a8;
        border-radius: 16px;
        background: #fffdf8;
        text-align: center;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 14px;
        line-height: 1.6;
      }
      a.btn {
        display: inline-block;
        margin: 6px 0;
        padding: 12px 20px;
        border-radius: 999px;
        background: #0b3fad;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      .preview {
        width: 96px;
        height: 96px;
        margin: 0 auto 14px;
        border-radius: 22px;
        object-fit: cover;
        background: #161d27;
      }
      .meta {
        font-size: 13px;
        color: #4a5568;
      }
      .meta a {
        color: #0b3fad;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Splash 圖示下載</h1>
      <img class="preview" src="./icons/splash/splash-icon-512.png" alt="防災通報 splash 圖示" />
      <p>PWA／iOS 啟動畫面與圖示 PNG（暮藍底＋圓角災防圖示）。</p>
      <p>
        <a class="btn" href="./splash-icons.zip" download="splash-icons.zip">下載 splash-icons.zip</a>
      </p>
      <p class="meta">
        資料夾：
        <a href="https://github.com/jin358-cmd/weather/tree/main/icons/splash">icons/splash</a>
      </p>
      <p class="meta">
        完整程式碼備份：<a href="./download.html">download.html</a>
      </p>
    </main>
  </body>
</html>
