name: PMOS Visual Editor Security Gates
on:
  push:
    branches:
      - feature/pmos-visual-editor-module
    paths:
      - 'api/visual-editor/**'
      - 'visual-editor/tests/**'
      - '.github/workflows/visual-editor-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm Node.js runtime
        run: node --version
      - name: Execute fail-closed security tests
        run: node --test visual-editor/tests/security-gates.test.cjs
