name: PMOS Visual Editor Security Gates
on:
  push:
    branches:
      - feature/pmos-visual-editor-module
    paths:
      - 'api/visual-editor/**'
      - 'visual-editor/tests/**'
      - '.github/workflows/visual-editor-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Confirm Node.js runtime
        run: node --version
      - name: Execute fail-closed security tests
        id: security_test
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap visual-editor/tests/security-gates.test.cjs 2>&1 | tee security-test-results.tap
      - name: Publish auditable test summary
        if: always()
        shell: bash
        run: |
          {
            echo '## PMOS Visual Editor Security Gates'
            echo "Commit: $GITHUB_SHA"
            echo 'Scope: API handler tests, not live HTTP E2E'
            echo 'Production deployment: NOT AUTHORIZED'
            echo '### TAP results'
            echo '~~~text'
            if [ -f security-test-results.tap ]; then
              cat security-test-results.tap
            else
              echo 'No test output: execution did not start or failed before output.'
            fi
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
