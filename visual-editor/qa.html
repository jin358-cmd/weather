<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMOS Visual Editor | Phase 09 QA</title><style>body{font:15px system-ui;background:#152132;color:#f1f5fb;margin:0;padding:22px}main{max-width:1000px;margin:auto}h1{font-size:23px}button{background:#ef913d;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer}iframe{width:100%;height:560px;background:#fff;border:1px solid #60748c;border-radius:8px}li{padding:8px;border-bottom:1px solid #394c62}#manual{display:grid;gap:12px;padding:16px;background:#24344a;border-radius:10px}#manual label{display:block}#manual input{width:18px;height:18px;vertical-align:middle;margin-right:10px}.pass{color:#9ee5b5}.fail{color:#ff9999}.pending{color:#f3d48b}small{color:#b4c2d2}</style></head><body><main><h1>PMOS Visual Editor｜Phase 09 驗證中心</h1><p>測試範圍：僅目前 Vercel Preview。此頁不發布、不寫入正式網站，也不更改 Production。</p><button id="run">執行 DOM 檢查</button> <button id="full">執行完整功能測試</button> <button id="evidence">下載 QA 證據 JSON</button> <button id="behavior">執行互動邏輯測試</button><p id="summary">尚未執行</p><ol id="results"></ol><iframe id="editor" title="Visual Editor QA" src="./live-layout.html"></iframe><p><a style="color:#ffc18b" href="./verification.html">前往 Verification Center 匯入測試證據與檢視阻塞</a></p><h2>實際操作驗收（需人工執行）</h2><p><small>模擬 PointerEvent 只能驗證程式邏輯，無法證明真實滑鼠／手機觸控及即時氣象 API 正常。以下每項實測後才勾選。</small></p><div id="manual"><label><input type="checkbox" data-check="mouse"> 桌機滑鼠實際選取、拖曳、復原</label><label><input type="checkbox" data-check="touch"> 手機觸控拖曳與頁面捲動</label><label><input type="checkbox" data-check="draft"> 儲存草稿、重整頁面、讀回設定</label><label><input type="checkbox" data-check="logo"> Logo 原圖、比例、位置與文字未遭更改</label><label><input type="checkbox" data-check="weather"> 天氣、地震、颱風及地圖資訊功能未受影響</label><label><input type="checkbox" data-check="owner"> Owner 已檢視 Preview 並確認結果</label></div><p><small>未完成人工驗收前，QA 狀態一律為 PARTIAL，不得標示正式發布核准。</small></p></main><script>
const $=id=>document.getElementById(id),checks=[];let lastEvidence=null;
function check(label,ok,detail=''){checks.push({label,ok,detail})}
function report(){lastEvidence={module:'PMOS-MOD-VISUAL-EDITOR-001',phase:'09.3',timestamp:new Date().toISOString(),origin:location.origin,commit:'runtime-page-version',scope:'Preview-only browser smoke checks; not a real human pointer/touch or live-data acceptance test',results:checks.map(c=>({name:c.label,status:c.ok?'PASS':'FAILED',detail:c.detail||''})),counts:{passed:checks.filter(c=>c.ok).length,failed:checks.filter(c=>!c.ok).length},manualVerification:Object.fromEntries([...document.querySelectorAll('#manual input')].map(x=>[x.dataset.check,x.checked?'SELF_REPORTED_PASS':'PENDING'])),ownerVerification:document.querySelector('#manual input[data-check=owner]')?.checked?'SELF_REPORTED':'PENDING',productionRelease:'NOT_AUTHORIZED'};const list=$('results');list.replaceChildren();for(const c of checks){const li=document.createElement('li');li.className=c.ok?'pass':'fail';li.textContent=(c.ok?'PASS ':'FAILED ')+c.label+(c.detail?'：'+c.detail:'');list.appendChild(li)}$('summary').textContent=checks.filter(c=>c.ok).length+'/'+checks.length+' 檢查通過；滑鼠／觸控實機與天氣 API 人工驗收仍為 PENDING'}
const required=['editMode','target','offsetX','offsetY','apply','undoMove','saveDraft','restoreDraft','diff','reset','site'];
function context(){const editor=$('editor'),d=editor.contentDocument,w=editor.contentWindow;if(!d?.body)throw Error('Adapter 尚未載入');const site=d.getElementById('site'),siteDoc=site?.contentDocument;if(!siteDoc?.body)throw Error('Weather iframe 尚未載入');return {d,w,site,siteDoc}}
const els={logo:'.hero-brand img',closure:'.closure-card',typhoon:'.typhoon-card',weather:'.weather-block',quake:'.earthquake-card',map:'.map-card'};
async function pageReady(){const e=$('editor');if(e.contentDocument?.readyState!=='complete')await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('編輯器載入逾時')),8000);e.addEventListener('load',()=>{clearTimeout(timeout);resolve()},{once:true})});const site=e.contentDocument?.getElementById('site');if(!site)throw Error('缺少 Weather iframe');if(site.contentDocument?.readyState!=='complete')await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('Weather 載入逾時')),12000);site.addEventListener('load',()=>{clearTimeout(timeout);resolve()},{once:true})});return context()}
$('run').onclick=async()=>{checks.length=0;try{const {d,siteDoc}=await pageReady();for(const id of required)check('控制項 '+id,!!d.getElementById(id));check('拖曳預設關閉',!d.getElementById('editMode').checked);for(const [name,sel] of Object.entries(els))check('Weather 元素 '+name,!!siteDoc.querySelector(sel));check('無 Production 發布控制項',!d.querySelector('#publish,#deployProduction,#promoteProduction'))}catch(e){check('DOM 檢查',false,e.message)}report()};
$('behavior').onclick=async()=>{checks.length=0;try{const {d,siteDoc}=await pageReady();const logo=siteDoc.querySelector(els.logo);if(!logo)throw Error('找不到 Logo');d.getElementById('target').value='logo';d.getElementById('offsetX').value='24';d.getElementById('offsetY').value='18';d.getElementById('apply').click();check('X/Y 位移',logo.style.transform.includes('24px')&&logo.style.transform.includes('18px'));const toggle=d.getElementById('editMode');toggle.click();check('開啟編輯模式',toggle.checked);toggle.click();check('關閉編輯模式',!toggle.checked);d.getElementById('reset').click();const s=d.getElementById('site');await new Promise((resolve,reject)=>{const timeout=setTimeout(()=>reject(Error('重設逾時')),10000);s.addEventListener('load',()=>{clearTimeout(timeout);resolve()},{once:true})});check('重設清除預覽修改',!s.contentDocument.getElementById('pmos-editor-preview-style'));check('重設後關閉拖曳模式',!toggle.checked)}catch(e){check('基本操作',false,e.message)}report()};
$('full').onclick=async()=>{checks.length=0;let saved=null;let storage=null;const key='pmos-weather-live-adapter-v2';try{const {d,w,siteDoc}=await pageReady();storage=w.localStorage;saved=storage.getItem(key);const logo=siteDoc.querySelector(els.logo);if(!logo)throw Error('找不到 Logo');const toggle=d.getElementById('editMode');check('拖曳模式預設關閉',!toggle.checked);toggle.checked=true;toggle.dispatchEvent(new Event('change',{bubbles:true}));
if(typeof w.PointerEvent!=='function')throw Error('此瀏覽器不支援 PointerEvent');const event=(type,x,y)=>new w.PointerEvent(type,{bubbles:true,cancelable:true,pointerId:5,pointerType:'mouse',isPrimary:true,button:0,buttons:type==='pointerup'?0:1,clientX:x,clientY:y});
logo.dispatchEvent(event('pointerdown',100,100));logo.dispatchEvent(event('pointermove',130,120));logo.dispatchEvent(event('pointerup',130,120));
check('模擬 PointerEvent 拖曳後位移 30／20',logo.style.transform.includes('30px')&&logo.style.transform.includes('20px'));
d.getElementById('undoMove').click();check('復原拖曳',logo.style.transform.includes('0px'));
d.getElementById('target').value='logo';d.getElementById('offsetX').value='16';d.getElementById('offsetY').value='12';d.getElementById('apply').click();d.getElementById('saveDraft').click();
const raw=storage.getItem(key);const draft=raw&&JSON.parse(raw);check('本機草稿儲存及讀回',draft?.offsets?.logo?.x===16&&draft?.offsets?.logo?.y===12);
d.getElementById('offsetX').value='0';d.getElementById('offsetY').value='0';d.getElementById('apply').click();d.getElementById('restoreDraft').click();
check('草稿還原位移',logo.style.transform.includes('16px')&&logo.style.transform.includes('12px'));
const source=siteDoc.querySelector('.hero-brand img');check('Logo 元素仍存在',!!source&&source.getAttribute('alt')!==null);check('沒有 Production 發布按鍵',!d.querySelector('#publish,#deployProduction,#promoteProduction'));
}catch(e){check('完整功能測試',false,e.message)}finally{try{if(storage){if(saved===null)storage.removeItem(key);else storage.setItem(key,saved)}}catch(e){check('測試草稿清理',false,e.message)}try{$('editor').contentDocument?.getElementById('reset')?.click()}catch{}report()}};
$('evidence').onclick=()=>{if(!lastEvidence){alert('請先執行測試');return}lastEvidence.manualVerification=Object.fromEntries([...document.querySelectorAll('#manual input')].map(x=>[x.dataset.check,x.checked?'SELF_REPORTED_PASS':'PENDING']));lastEvidence.ownerVerification=document.querySelector('#manual input[data-check=owner]')?.checked?'SELF_REPORTED':'PENDING';const blob=new Blob([JSON.stringify(lastEvidence,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pmos-visual-editor-qa-'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.querySelectorAll('#manual input').forEach(x=>x.addEventListener('change',()=>{if(lastEvidence){lastEvidence.manualVerification[x.dataset.check]=x.checked?'SELF_REPORTED_PASS':'PENDING'}}));
</script></body></html>
