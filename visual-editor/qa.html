<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMOS Visual Editor | Phase 09 QA</title><style>body{font:15px system-ui;background:#152132;color:#f1f5fb;margin:0;padding:22px}main{max-width:1000px;margin:auto}h1{font-size:23px}button{background:#ef913d;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer}iframe{width:100%;height:560px;background:#fff;border:1px solid #60748c;border-radius:8px}li{padding:8px;border-bottom:1px solid #394c62}.pass{color:#9ee5b5}.fail{color:#ff9999}.pending{color:#f3d48b}small{color:#b4c2d2}</style></head><body><main><h1>PMOS Visual Editor｜Phase 09 驗證中心</h1><p>測試範圍：僅目前 Vercel Preview。此頁不發布、不寫入正式網站，也不更改 Production。</p><button id="run">執行 DOM 檢查</button> <button id="behavior">執行互動邏輯測試</button><p id="summary">尚未執行</p><ol id="results"></ol><iframe id="editor" title="Visual Editor QA" src="./live-layout.html"></iframe><h2>人工驗收項目</h2><p><small>自動檢查不能取代實際滑鼠／觸控操作。請在下方預覽中確認：拖曳開關預設關閉、啟用後可拖曳、復原、儲存草稿、重新載入後還原、Logo 不變形，以及天氣／地震／颱風功能正常。</small></p></main><script>
const $=id=>document.getElementById(id),checks=[];const sleep=ms=>new Promise(r=>setTimeout(r,ms));function check(label,ok,detail=''){checks.push({label,ok,detail})}function report(){const list=$('results');list.replaceChildren();for(const c of checks){const li=document.createElement('li');li.className=c.ok?'pass':'fail';li.textContent=(c.ok?'PASS ':'FAILED ')+c.label+(c.detail?'：'+c.detail:'');list.appendChild(li)}$('summary').textContent=checks.filter(c=>c.ok).length+'/'+checks.length+' 自動檢查通過；人工互動驗收仍為 PENDING'}
$('run').onclick=async()=>{checks.length=0;const iframe=$('editor');try{const doc=iframe.contentDocument;if(!doc||!doc.body)throw Error('編輯器尚未載入');check('預覽頁面可讀取',true);const controls=['editMode','target','offsetX','offsetY','apply','undoMove','saveDraft','restoreDraft','diff','reset','site'];for(const id of controls)check('控制項 '+id,!!doc.getElementById(id));const toggle=doc.getElementById('editMode');check('拖曳預設關閉',!!toggle&&!toggle.checked);const site=doc.getElementById('site');const siteDoc=site?.contentDocument;if(!siteDoc||!siteDoc.body){check('Weather 真實頁面已載入',false,'可能尚未載入，請稍後重試')}else{check('Weather 真實頁面已載入',true);for(const [name,selector] of Object.entries({logo:'.hero-brand img',closure:'.closure-card',typhoon:'.typhoon-card',weather:'.weather-block',quake:'.earthquake-card',map:'.map-card'}))check('真實頁面元素 '+name,!!siteDoc.querySelector(selector));check('未自動注入預覽修改',!siteDoc.getElementById('pmos-editor-preview-style'))}check('未提供正式發布按鍵',!doc.querySelector('#publish,#deployProduction,#promoteProduction'))}catch(e){check('測試執行',false,e.message)}report()};
$('behavior').onclick=async()=>{checks.length=0;const iframe=$('editor');try{let doc=iframe.contentDocument,win=iframe.contentWindow;if(!doc?.body)throw Error('Adapter 未載入');let site=doc.getElementById('site'),siteDoc=site?.contentDocument;if(!siteDoc?.body)throw Error('Weather iframe 未載入');const toggle=doc.getElementById('editMode');check('編輯模式預設關閉',!toggle.checked);const target=siteDoc.querySelector('.hero-brand img');if(!target)throw Error('Logo 元素不存在');const before=target.style.transform;doc.getElementById('target').value='logo';doc.getElementById('offsetX').value='24';doc.getElementById('offsetY').value='18';doc.getElementById('apply').click();check('套用 X/Y 位移',target.style.transform.includes('24px')&&target.style.transform.includes('18px'));doc.getElementById('editMode').click();check('編輯模式可開啟',toggle.checked);doc.getElementById('editMode').click();check('編輯模式可關閉',!toggle.checked);doc.getElementById('reset').click();await sleep(600);site=doc.getElementById('site');siteDoc=site?.contentDocument;check('重設移除預覽注入樣式',!!siteDoc?.body&&!siteDoc.getElementById('pmos-editor-preview-style'));check('重設關閉編輯模式',!toggle.checked);check('測試不提供正式發布',!doc.querySelector('#publish,#deployProduction,#promoteProduction'));}catch(e){check('互動測試執行',false,e.message)}report()};
</script></body></html>
