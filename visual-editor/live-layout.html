<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMOS Weather Visual Editor</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif;background:#0c1522;color:#eef4fc}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{border:0;border-radius:8px;padding:9px 11px;background:#f0933f;color:#132033;font-weight:750;cursor:pointer}button.secondary{background:#354d68;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}header{min-height:64px;padding:12px 18px;background:#18283b;border-bottom:2px solid #f0933f;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0}.subtitle,.note{font-size:12px;color:#adc0d5;line-height:1.55}.state{font-size:13px;color:#b9c8d8}.state[data-tone=ok]{color:#8ee0aa}.state[data-tone=warn]{color:#ffd18d}.state[data-tone=bad]{color:#ff9d9d}.app-shell{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{background:#17263a;padding:16px;overflow:auto;max-height:calc(100vh - 64px);display:flex;flex-direction:column;gap:13px}.notice{background:#342719;border:1px solid #7c552b;color:#ffdda7;border-radius:9px;padding:10px;font-size:12px;line-height:1.55}.mode{display:flex;align-items:center;gap:9px;background:#0f1c2b;padding:10px;border-radius:9px}.mode input{width:20px;height:20px}.field{display:block;font-size:12px;color:#d7e1ec}.field input,.field select,.field textarea{width:100%;margin-top:5px;background:#0c1827;border:1px solid #58718c;color:#fff;border-radius:7px;padding:8px}.field textarea{min-height:82px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar button{flex:1 1 90px}.selection{background:#101e2e;border:1px solid #3b5873;border-radius:9px;padding:10px}.selection strong{display:block;color:#ffb56f;margin-bottom:8px}.preview{min-width:0;padding:12px;background:#0a111b;overflow:auto}.device-label{text-align:center;font-size:12px;color:#9eb2c7;margin:0 0 7px}.device-frame{margin:auto;transition:width .2s;max-width:100%;width:100%}.device-frame[data-device=mobile]{width:390px}.device-frame iframe{display:block;width:100%;height:calc(100vh - 112px);min-height:640px;border:2px solid #516a83;border-radius:11px;background:#fff}dialog{background:#17263a;color:#fff;border:1px solid #66809a;border-radius:12px;width:min(560px,90vw)}dialog::backdrop{background:#000a}dialog ul{list-style:none;padding:0;display:grid;gap:8px}dialog button{width:100%}.links{display:flex;gap:12px;flex-wrap:wrap}.links a{color:#ffb56f;font-size:12px}@media(max-width:900px){.app-shell{grid-template-columns:1fr}aside{max-height:none}.device-frame iframe{height:75vh}.preview{padding:8px}}@media(max-width:430px){header{padding:10px 12px}.app-shell aside{padding:12px}.row{grid-template-columns:1fr}.toolbar button{flex-basis:120px}.device-frame[data-device=mobile]{width:100%}}
</style></head><body>
<header><div><h1>PMOS Visual Editor · 真實 Weather 頁面</h1><div class="subtitle">PMOS-MOD-VISUAL-EDITOR-001 · Preview only</div></div><span class="state" id="state">載入中…</span></header>
<div class="app-shell"><aside>
  <div class="notice"><strong>本機草稿限制：</strong>內容只存在這個瀏覽器／裝置，不會同步、不寫正式資料庫、不修改 weather.pmos.space。Production LOCKED。</div>
  <label class="mode"><input type="checkbox" id="editMode"><span><strong>啟用點選編輯</strong><br><span class="note">關閉時可正常操作天氣、地震、颱風與地圖功能</span></span></label>
  <label class="field">預覽裝置<select id="device"><option value="desktop">桌機</option><option value="mobile">手機 390px（模擬）</option></select></label>
  <label class="field">快速選擇區塊<select id="target"><option value="logo">Logo</option><option value="closure">停班停課卡片</option><option value="typhoon">颱風卡片</option><option value="weather">天氣卡片</option><option value="quake">地震卡片</option><option value="map">災害地圖卡片</option><option value="clicked-text" disabled>已點選的文字</option></select></label>
  <div class="selection"><strong id="selectionName">Logo</strong>
    <div class="row"><label class="field">水平位移 px<input id="x" type="number" min="-600" max="600" value="0"></label><label class="field">垂直位移 px<input id="y" type="number" min="-600" max="600" value="0"></label></div>
    <label class="field" id="widthRow">寬度 px<input id="width" type="number" min="40" max="1400" placeholder="原始寬度"></label>
    <label class="field" id="heightRow" hidden>高度 px<input id="height" type="number" min="80" max="1600" placeholder="原始高度"></label>
    <label class="field" id="fontRow" hidden>字級 px<input id="fontSize" type="number" min="10" max="96" placeholder="原始字級"></label>
    <label class="field" id="textRow" hidden>文字內容<textarea id="textValue" maxlength="2000"></textarea></label>
  </div>
  <label class="field">上傳 Logo（保留原始位元）<input id="logo" type="file" accept="image/png,image/jpeg,image/webp"></label><div class="note" id="logoEvidence">未上傳替換 Logo；原站 Logo 保持不變。</div>
  <label class="field">頂層卡片間距 <span id="gapValue">16</span>px<input id="gap" type="range" min="0" max="64" value="16"></label>
  <div class="toolbar"><button id="undo" class="secondary">復原</button><button id="redo" class="secondary">重做</button><button id="saveDraft">儲存本機草稿</button><button id="restoreDraft" class="secondary">重新讀取</button><button id="versions" class="secondary">歷史版本</button><button id="export" class="secondary">匯出 JSON</button><button id="import" class="secondary">匯入 JSON</button><input id="importFile" type="file" accept="application/json,.json" hidden><button id="reset" class="secondary">重設預覽</button></div>
  <div id="report" class="note">載入後會掃描真實 DOM。橘色控制點位於獨立覆蓋層，不會把拖曳事件綁在網站按鈕上。</div>
  <div class="links"><a href="./qa.html">QA 驗證</a><a href="./verification.html">Verification Center</a></div>
</aside><main class="preview"><p class="device-label" id="deviceLabel">桌機預覽</p><div class="device-frame" data-device="desktop"><iframe id="site" src="../index.html" title="PMOS Weather live preview"></iframe></div></main></div>
<dialog id="versionsDialog"><h2>本機歷史版本</h2><p class="note">僅限此瀏覽器。選擇版本會先將目前狀態放入復原堆疊。</p><ul id="versionList"></ul><button id="closeVersions" class="secondary">關閉</button></dialog>
<script src="./editor-core.js"></script><script src="./editor-app.js"></script></body></html>
