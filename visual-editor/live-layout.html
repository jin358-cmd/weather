<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMOS Weather | Real Layout Adapter Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#121c2b;color:#f0f5fc;font:15px system-ui,"Noto Sans TC",sans-serif}header{padding:14px 18px;background:#223349;border-bottom:2px solid #e88b3c;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}header strong{font-size:18px}.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 65px)}aside{padding:20px;background:#1d2c40;display:flex;flex-direction:column;gap:13px}label{font-size:13px}input,select,button{font:inherit;width:100%;margin-top:6px;border-radius:7px;padding:9px}input,select{background:#101d2b;border:1px solid #677e95;color:#fff}button{background:#ee923d;color:#152033;border:0;cursor:pointer;font-weight:700}button.secondary{background:#3b526b;color:#fff}.preview{padding:12px;min-width:0}iframe{display:block;width:100%;height:calc(100vh - 120px);min-height:600px;border:2px solid #50677f;border-radius:10px;background:white}.note{font-size:12px;color:#aabbd0;line-height:1.6}.state{font-size:12px;color:#98d5ad}.warning{background:#3d2d1b;color:#ffdda9;padding:9px;border-radius:7px;font-size:12px}@media(max-width:800px){.wrap{grid-template-columns:1fr}iframe{height:75vh}}</style></head><body><header><strong>PMOS Visual Editor · Weather 真實頁面 Adapter</strong><span class="state" id="state">Preview only · 不發布</span></header><div class="wrap"><aside><div class="warning">僅修改本次 Preview iframe 的顯示效果，不寫入原站、不提交 GitHub、不更新正式網域。</div><label>Logo 圖片<input type="file" id="logo" accept="image/png,image/jpeg,image/webp"></label><label>Logo 顯示寬度<input type="range" id="width" min="70" max="450" value="220"></label><label>Logo 對齊<select id="align"><option value="left">靠左</option><option value="center">置中</option><option value="right">靠右</option></select></label><label>首頁卡片間距<input type="range" id="gap" min="4" max="40" value="16"></label><label>預覽裝置<select id="device"><option value="desktop">桌機</option><option value="mobile">手機（390px）</option></select></label><label>選擇編輯區塊<select id="target"><option value="logo">Logo</option><option value="closure">停班停課</option><option value="typhoon">颱風</option><option value="weather">天氣</option><option value="quake">地震</option><option value="map">災害地圖</option></select></label><label>水平位移（px）<input type="number" id="offsetX" min="-120" max="120" value="0"></label><label>垂直位移（px）<input type="number" id="offsetY" min="-120" max="120" value="0"></label><button id="apply">套用到預覽畫面</button><button class="secondary" id="saveDraft">儲存本機草稿</button><button class="secondary" id="restoreDraft">讀取本機草稿</button><button class="secondary" id="diff">檢視變更差異</button><button class="secondary" id="reset">重新載入原始畫面</button><button class="secondary" id="export">匯出調整設定 JSON</button><div class="note" id="report">載入後自動檢查 Logo 與卡片選擇器。若找不到元素，會明確顯示，不會假裝修改成功。</div><a style="color:#ffb775" href="./">返回示意編輯器</a></aside><div class="preview"><iframe id="site" src="../index.html" title="PMOS Weather preview"></iframe></div></div><script>
const $=id=>document.getElementById(id);const frame=$('site');let imageUrl=null;let original=null;let selected=null;let applied={};const draftKey='pmos-weather-live-adapter-v2';const targets={logo:'.hero-brand img',closure:'.closure-card',typhoon:'.typhoon-card',weather:'.weather-block',quake:'.earthquake-card',map:'.map-card'};const offsets={};
function inspect(){try{const d=frame.contentDocument;if(!d||!d.body)throw Error('iframe 尚未載入');const logos=[...d.querySelectorAll('.hero-brand img')];const cards=[...d.querySelectorAll('.app > .card, .app > section.card')];selected={logos,cards};$('report').textContent='實際 DOM 掃描：Logo 候選 '+logos.length+' 個；頂層卡片 '+cards.length+' 個。'+(logos.length?'可調整 Logo 預覽。':'尚未找到 Logo，請檢查實際 DOM selector。');$('state').textContent='真實頁面已載入（Preview）'}catch(e){$('report').textContent='讀取失敗：'+e.message;$('state').textContent='Adapter 未就緒'}}
frame.addEventListener('load',()=>{original=null;selected=null;inspect()});
$('logo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>3000000){alert('僅支援 3MB 以下 PNG/JPEG/WebP');return}if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(f);$('state').textContent='Logo 待套用'});
$('device').addEventListener('change',()=>{frame.style.maxWidth=$('device').value==='mobile'?'390px':'none';frame.style.margin='0 auto'});
$('apply').onclick=()=>{try{if(!selected)inspect();if(!selected)throw Error('未找到頁面 DOM');const d=frame.contentDocument;let style=d.getElementById('pmos-editor-preview-style');if(!style){style=d.createElement('style');style.id='pmos-editor-preview-style';d.head.appendChild(style)}const width=Number($('width').value),gap=Number($('gap').value),align=$('align').value;style.textContent='.app > .card, .app > section.card{margin-bottom:'+gap+'px!important}.hero .hero-brand{display:flex!important;justify-content:'+({left:'flex-start',center:'center',right:'flex-end'})[align]+'!important}';let n=0;for(const img of selected.logos){if(imageUrl){img.src=imageUrl;img.removeAttribute('srcset')}img.style.setProperty('width',width+'px','important');img.removeAttribute('height');img.style.setProperty('max-width','100%','important');n++}const target=$('target').value;const node=d.querySelector(targets[target]);if(node){const x=Math.max(-120,Math.min(120,Number($('offsetX').value)||0)),y=Math.max(-120,Math.min(120,Number($('offsetY').value)||0));node.style.setProperty('transform','translate('+x+'px,'+y+'px)','important');offsets[target]={x,y}}applied={schema:'pmos.weather.adapter.v2',logoWidth:width,logoAlign:align,cardGap:gap,offsets:structuredClone(offsets),logoUploaded:!!imageUrl};$('report').textContent='已套用到 iframe：'+n+' 個 Logo 候選；'+selected.cards.length+' 個卡片匹配。'+(n===0?' Logo 未套用，因為未找到元素。':'');$('state').textContent='Preview 已更新 · 尚未儲存或發布'}catch(e){$('report').textContent='套用失敗：'+e.message}};
$('saveDraft').onclick=()=>{if(!Object.keys(applied).length){alert('請先套用預覽');return}try{localStorage.setItem(draftKey,JSON.stringify(applied));$('state').textContent='本機草稿已儲存（非雲端）'}catch(e){alert('儲存失敗：'+e.message)}};$('restoreDraft').onclick=()=>{try{const saved=JSON.parse(localStorage.getItem(draftKey)||'null');if(!saved||saved.schema!=='pmos.weather.adapter.v2')throw Error('找不到有效草稿');$('width').value=saved.logoWidth;$('align').value=saved.logoAlign;$('gap').value=saved.cardGap;Object.assign(offsets,saved.offsets||{});$('target').value='logo';$('offsetX').value=offsets.logo?.x||0;$('offsetY').value=offsets.logo?.y||0;$('apply').click();for(const [key,value] of Object.entries(offsets)){const node=frame.contentDocument.querySelector(targets[key]);if(node)node.style.setProperty('transform','translate('+value.x+'px,'+value.y+'px)','important')} $('state').textContent='本機草稿已載入（Preview）'}catch(e){alert('讀取失敗：'+e.message)}};$('target').onchange=()=>{const o=offsets[$('target').value]||{x:0,y:0};$('offsetX').value=o.x;$('offsetY').value=o.y};$('diff').onclick=()=>{if(!Object.keys(applied).length){alert('尚無已套用的設定');return}alert('相對原始版面之變更（僅預覽）：\\n'+JSON.stringify(applied,null,2)+'\\n\\n未修改正式網站。')};$('reset').onclick=()=>{frame.contentWindow.location.reload();applied={}};
$('export').onclick=()=>{if(!Object.keys(applied).length){alert('請先套用預覽');return}const b=new Blob([JSON.stringify(applied,null,2)],{type:'application/json'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='pmos-weather-adapter-preview.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
</script></body></html>
