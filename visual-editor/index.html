<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMOS Visual Editor | Preview</title>
<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#e9edf5;background:#101823}*{box-sizing:border-box}body{margin:0}header{padding:16px 22px;background:#1b2634;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ef8938}h1{font-size:19px;margin:0}small{color:#aab8c9}.layout{display:grid;grid-template-columns:275px minmax(0,1fr);min-height:calc(100vh - 68px)}aside{background:#1b2634;padding:20px;display:flex;flex-direction:column;gap:13px}label{display:block;font-size:13px;color:#cbd4df}input,select,button{font:inherit}input[type=text],input[type=file],select{width:100%;padding:9px;border:1px solid #526172;border-radius:8px;background:#101823;color:white}button{border:0;background:#ed8a39;color:#141b24;border-radius:8px;padding:10px 12px;cursor:pointer;font-weight:700}button.secondary{background:#39495d;color:white}main{padding:24px;overflow:auto}.canvas{max-width:1050px;margin:auto;background:#f5f7fb;color:#1d3046;min-height:650px;border-radius:14px;padding:26px;box-shadow:0 12px 50px #0004}.brand{display:flex;align-items:center;gap:16px;border:2px dashed transparent;padding:10px;border-radius:8px}.brand img{max-width:260px;max-height:130px;object-fit:contain}.brand h2{font-size:30px;margin:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:30px}.tile{background:white;border:2px solid #dce2eb;border-radius:12px;padding:22px;min-height:155px;cursor:grab;touch-action:none}.tile:focus,.brand:focus{outline:3px solid #ed8a39}.tile strong{font-size:20px}.tile p{color:#52657c}.tile.dragging{opacity:.5}.status{font-size:12px;color:#9ed2a4}.warning{padding:12px;background:#fff3dc;color:#7d4b0a;border-radius:8px;margin-top:24px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:750px){.layout{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.brand{flex-direction:column;align-items:flex-start}}
</style></head><body>
<header><div><h1>PMOS Visual Editor <small> · Weather Adapter</small></h1><small>獨立 Preview · 不連接正式發布</small></div><span id="status" class="status">尚未儲存</span></header>
<div class="layout"><aside>
<label>Logo 原始 PNG 上傳<input id="logo" type="file" accept="image/png,image/webp,image/jpeg"></label>
<label>Logo 寬度 <span id="sizeValue">200</span>px<input id="size" type="range" min="60" max="400" value="200"></label>
<label>Logo 對齊<select id="align"><option value="left">靠左</option><option value="center">置中</option><option value="right">靠右</option></select></label>
<label>主標題<input id="heading" type="text" value="PMOS Weather"></label>
<label>副標題<input id="subtitle" type="text" value="天氣、地震、颱風與災害警報"></label>
<label>卡片欄數<select id="columns"><option value="2">兩欄</option><option value="1">一欄</option><option value="3">三欄</option></select></label>
<div class="toolbar"><button id="save">儲存本機草稿</button><button class="secondary" id="export">匯出 JSON</button><button class="secondary" id="reset">重設</button></div>
<small>拖曳卡片可改變順序；點選卡片標題或說明可直接編輯。草稿僅存於目前瀏覽器，尚無雲端同步。</small>
</aside><main><div class="canvas" id="canvas"><div class="brand" id="brand"><img id="previewLogo" alt="上傳後顯示原始 Logo" hidden><div><h2 id="previewHeading" contenteditable="true">PMOS Weather</h2><div id="previewSubtitle" contenteditable="true">天氣、地震、颱風與災害警報</div></div></div><div class="cards" id="cards"></div><div class="warning">這是獨立編輯預覽。卡片是示意資料，不代表即時天氣或災害資訊；此頁不會修改 weather.pmos.space。</div></div></main></div>
<script>
const key='pmos-visual-editor-draft-v1';const defaults={heading:'PMOS Weather',subtitle:'天氣、地震、颱風與災害警報',size:200,align:'left',columns:2,logo:'',cards:[{id:'weather',title:'即時天氣',description:'Weather data widget'},{id:'quake',title:'地震資訊',description:'Earthquake data widget'},{id:'typhoon',title:'颱風動態',description:'Typhoon tracking widget'},{id:'alert',title:'災害警報',description:'Disaster alert widget'}]};let state=structuredClone(defaults);
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&Array.isArray(saved.cards))state={...state,...saved}}catch{}
const $=id=>document.getElementById(id);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function mark(){$('status').textContent='有未儲存變更'}
function render(){['heading','subtitle','size','align','columns'].forEach(k=>$(k).value=state[k]);$('sizeValue').textContent=state.size;$('previewHeading').textContent=state.heading;$('previewSubtitle').textContent=state.subtitle;$('previewLogo').hidden=!state.logo;if(state.logo)$('previewLogo').src=state.logo;$('previewLogo').style.width=state.size+'px';$('brand').style.justifyContent=({left:'flex-start',center:'center',right:'flex-end'})[state.align];$('cards').style.gridTemplateColumns='repeat('+state.columns+',minmax(0,1fr))';$('cards').innerHTML=state.cards.map(c=>'<article class="tile" draggable="true" data-id="'+escapeHTML(c.id)+'"><strong contenteditable="true" data-field="title">'+escapeHTML(c.title)+'</strong><p contenteditable="true" data-field="description">'+escapeHTML(c.description)+'</p></article>').join('')}
render();['heading','subtitle','size','align','columns'].forEach(k=>$(k).addEventListener('input',e=>{state[k]=['size','columns'].includes(k)?Number(e.target.value):e.target.value;render();mark()}));
['previewHeading','previewSubtitle'].forEach((id,i)=>$(id).addEventListener('input',e=>{const k=i?'subtitle':'heading';state[k]=e.target.textContent;$(k).value=state[k];mark()}));
$('logo').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;if(!['image/png','image/webp','image/jpeg'].includes(file.type)||file.size>1500000){alert('請上傳 1.5MB 以下 PNG、WebP 或 JPEG');return}const reader=new FileReader();reader.onload=()=>{state.logo=reader.result;render();mark()};reader.readAsDataURL(file)});
$('cards').addEventListener('input',e=>{const field=e.target.dataset.field;if(!field)return;const card=state.cards.find(c=>c.id===e.target.closest('.tile').dataset.id);if(card){card[field]=e.target.textContent;mark()}});
let dragged=null;$('cards').addEventListener('dragstart',e=>{const tile=e.target.closest('.tile');if(tile){dragged=tile.dataset.id;tile.classList.add('dragging')}});$('cards').addEventListener('dragover',e=>e.preventDefault());$('cards').addEventListener('drop',e=>{e.preventDefault();const tile=e.target.closest('.tile');if(!tile||!dragged||tile.dataset.id===dragged)return;const from=state.cards.findIndex(c=>c.id===dragged),to=state.cards.findIndex(c=>c.id===tile.dataset.id);state.cards.splice(to,0,state.cards.splice(from,1)[0]);render();mark()});$('cards').addEventListener('dragend',()=>{dragged=null;document.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'))});
$('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(state));$('status').textContent='本機草稿已儲存'}catch{alert('儲存失敗，可能是 Logo 太大或瀏覽器儲存空間不足')}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({schema:'pmos.visual-editor.v1',...state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pmos-weather-layout.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('reset').onclick=()=>{if(!confirm('確定重設本機編輯內容？'))return;state=structuredClone(defaults);localStorage.removeItem(key);render();mark()};
</script></body></html>
